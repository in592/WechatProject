<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园管家 · 管理后台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">校</div>
      <div>
        <h1>校园管家</h1>
        <p>活动管理后台 · 通知导入 / 编辑 / 删除</p>
      </div>
    </div>
    <div class="server-status" id="serverStatus">
      <span class="dot"></span><span id="serverStatusText">连接中…</span>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="card-head">
        <h2>导入通知</h2>
        <span class="muted">粘贴原文 → 解析 → 可微调 → 导入</span>
      </div>

      <label class="field">
        <span class="label">通知原文</span>
        <textarea id="noticeText" rows="7" placeholder="例：【活动通知】周五下午3点到5点，在图书馆三楼报告厅举办《人工智能前沿讲座》，可获0.5学分，欢迎参加！"></textarea>
      </label>

      <div class="split">
        <label class="field compact">
          <span class="label">来源</span>
          <select id="source">
            <option value="web">网页后台</option>
            <option value="qq">QQ（预留）</option>
          </select>
        </label>
        <div class="btn-row">
          <button type="button" class="btn ghost" id="parseBtn">解析</button>
          <button type="button" class="btn primary" id="importBtn">导入</button>
          <button type="button" class="btn text hidden" id="cancelEditBtn">取消编辑</button>
        </div>
      </div>

      <div class="warnings hidden" id="warnings"></div>

      <div class="fields">
        <label class="field span-2">
          <span class="label">标题</span>
          <input id="fTitle" type="text" placeholder="活动标题">
        </label>
        <label class="field">
          <span class="label">开始时间</span>
          <input id="fStart" type="datetime-local">
        </label>
        <label class="field">
          <span class="label">结束时间</span>
          <input id="fEnd" type="datetime-local">
        </label>
        <label class="field">
          <span class="label">地点</span>
          <input id="fLocation" type="text" placeholder="活动地点">
        </label>
        <label class="field">
          <span class="label">学分</span>
          <input id="fCredit" type="number" step="0.5" min="0" placeholder="可留空">
        </label>
        <label class="field span-2">
          <span class="label">类型</span>
          <select id="fType">
            <option value="学术科技">学术科技</option>
            <option value="志愿公益">志愿公益</option>
            <option value="文体活动">文体活动</option>
            <option value="技能特长">技能特长</option>
            <option value="其他">其他</option>
          </select>
        </label>
      </div>
      <p class="hint">网页端可以用 <code>datetime-local</code>；小程序端不支持，那边用 picker。</p>
    </section>

    <section class="card list-card">
      <div class="card-head">
        <h2>活动列表</h2>
        <span class="muted" id="count">0 条</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>标题</th>
              <th>时间</th>
              <th>地点</th>
              <th>学分</th>
              <th>类型</th>
              <th>来源</th>
              <th class="ops-head">操作</th>
            </tr>
          </thead>
          <tbody id="activityBody">
            <tr><td colspan="7" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
